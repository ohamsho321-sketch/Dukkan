name: Build Souk Al Dannyeh for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'eslint.config.mjs'
      - 'tsconfig*.json'
      - 'vitest.config.mjs'
      - 'src-tauri/**'
      - 'package*.json'
      - 'vite.config.mjs'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reject committed runtime secrets and databases
        shell: pwsh
        run: |
          $forbidden = git ls-files | Where-Object { $_ -match '(^|/)(\.env($|\.)|.*\.sqlite3($|-wal$|-shm$))' -and $_ -notmatch '\.env\.example$' }
          if ($forbidden) { throw "Sensitive runtime files are tracked: $($forbidden -join ', ')" }
      - name: Build frontend
        run: |
          npm run lint
          npm test
          npm run test:migrations
          npm run build
      - name: Browser regression tests
        run: |
          npx playwright install chromium
          npm run test:e2e
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test native database and authorization
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri bundles
        run: npm run tauri build
      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer was not generated.' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $locations = @(
            (Join-Path $env:LOCALAPPDATA 'Programs'),
            (Join-Path $env:LOCALAPPDATA 'سوق الضنية المركزي'),
            $env:ProgramFiles
          )
          $app = $null
          foreach ($location in $locations) {
            if (Test-Path $location) {
              $app = Get-ChildItem -Path $location -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -ieq '.exe' -and $_.Name -notmatch 'uninstall' -and $_.DirectoryName -match 'الضنية|Dannyeh' } | Select-Object -First 1
              if ($app) { break }
            }
          }
          if (-not $app) { throw 'The installed Souk Al Dannyeh executable was not found.' }
          $running = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($running.HasExited) { throw 'Souk Al Dannyeh exited during the installer smoke test.' }
          Stop-Process -Id $running.Id -Force
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Souk-Al-Dannyeh-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish verified GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dukkan ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES_v1.2.2.md
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
