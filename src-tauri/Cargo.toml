[package]
name = "souk-al-dannyeh-pos"
version = "1.2.1"
description = "سوق الضنية المركزي — كاشير ومحاسبة محلية"
authors = ["Tarek Elomami (original Dukkan), Souk Al Dannyeh customization"]
edition = "2021"

[lib]
name = "souk_al_dannyeh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
thiserror = "2"
pbkdf2 = "0.12"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
